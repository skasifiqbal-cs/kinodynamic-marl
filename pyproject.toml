[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "kinodynamic-rl"
version = "0.1.0"
description = "Decentralized RL for second-order (kinodynamic) multi-robot navigation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "pettingzoo>=1.24.0",
    "gymnasium>=0.29.0",
    "skrl>=1.3.0,<2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
# `dubins` is optional — code falls back to the bundled pure-Python implementation.
dubins = ["dubins>=1.0.1"]
# Trajectory-optimisation planner (approach=planning approach.method=optimization).
planning = ["casadi>=3.6"]
wandb = ["wandb>=0.17.0"]
viewer = ["streamlit>=1.30.0"]
dev = ["pytest>=7.0", "ruff>=0.4.0"]

# `pip install -e .` exposes the `src` package, so the PYTHONPATH=. shim is no longer
# needed for scripts/.
[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Pragmatic set: pyflakes (F) + a subset of pycodestyle. Keep it low-noise so CI is useful.
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line length (long, intentional comments)
    "E741",  # ambiguous var names (math: l, I)
]

[tool.ruff.lint.per-file-ignores]
# viewer chdir's to the repo root before importing the streamlit app modules.
"scripts/viewer.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
