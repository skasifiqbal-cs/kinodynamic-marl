# @package _global_
# Heterogeneous robots + lidar obs
# Run: python train.py +experiment=hetero_lidar
defaults:
  - override /env: crossing
  - override /shaping: euclidean
  - override /network: mlp
  - override /obs: lidar
  - override /init: random

env:
  agents:
    - id: agent_0
      start: [0.0, 0.0, 0.0]
      goal:  [3.0, 3.0, 0.0]
      robot: unicycle_v1
    - id: agent_1
      start: [3.0, 0.0, 0.0]
      goal:  [0.0, 3.0, 0.0]
      robot: car_kinematic
