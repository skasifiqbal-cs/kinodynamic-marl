# @package train
timesteps: 1_000_000
num_envs: 16          # parallel actors. Each PPO update sees rollouts x num_envs transitions
                     # -> lower-variance gradient, denser reach signal. 1 = old single-env path.
                     # COST: the vec env is a serial Python loop, so a timestep costs
                     # O(num_envs x N x N). Measured at N=32: 12.3 it/s at 16, 33.4 at 4.
                     # With share_policy the shared net still sees N x num_envs x rollouts
                     # per update cycle, so at large N drop this: 16 (N<=8), 8 (N=16), 4 (N=32).
share_policy: false   # one policy+value shared by every agent, instead of one pair each.
                      # Valid only for a homogeneous team (identical obs/action spaces --
                      # asserted at build time). Separate nets at N=32 mean 64 networks each
                      # trained on 1/32 of the experience; sharing pools it. Costs nothing in
                      # wall-clock (skrl still loops per agent) -- the win is sample efficiency,
                      # which is what lets num_envs come down. Keep false to reproduce runs
                      # before 2026-09-06.
rollouts: 256
learning_rate: 5.0e-5      # gentler — damps the reach-then-diverge oscillation
discount: 0.99
lambda_: 0.95
clip_ratio: 0.2
epochs: 3                   # fewer passes/rollout — less overfit to high-variance returns
mini_batches: 8
value_preprocessor: false  # random-init returns are bimodal (0..+100 / -500); the running
                           # value normaliser's std swings and destabilises value loss
entropy_loss_scale: 0.01   # steadier exploration for goal-conditioned random-init nav
kl_threshold: 0.01         # tighter trust region — smaller, more stable updates
min_lr: 1.0e-5             # KL-adaptive LR floor
max_lr: 6.0e-5             # KL-adaptive LR ceiling. Was 1.0e-4, which oscillated: open_cross_4
                           # solved at 400k, lost it until 800k, recovered by 900k. Raise only if
                           # a run is clearly learning too slowly rather than diverging.
seed: 42

# Steps between checkpoint writes. Lower it for a quick run you intend to render:
# a short run at the default finishes with an empty checkpoints/ dir.
checkpoint_interval: 50_000
