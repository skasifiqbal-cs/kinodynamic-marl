# @package train
timesteps: 1_000_000
num_envs: 16          # parallel actors. Each PPO update sees rollouts x num_envs transitions
                     # -> lower-variance gradient, denser reach signal. 1 = old single-env path.
rollouts: 256
learning_rate: 5.0e-5      # gentler — damps the reach-then-diverge oscillation
discount: 0.99
lambda_: 0.95
clip_ratio: 0.2
epochs: 3                   # fewer passes/rollout — less overfit to high-variance returns
mini_batches: 8
value_preprocessor: false  # random-init returns are bimodal (0..+100 / -500); the running
                           # value normaliser's std swings and destabilises value loss
entropy_loss_scale: 0.01   # steadier exploration for goal-conditioned random-init nav
kl_threshold: 0.01         # tighter trust region — smaller, more stable updates
min_lr: 1.0e-5             # KL-adaptive LR floor
max_lr: 1.0e-4             # KL-adaptive LR ceiling — lower (e.g. 6e-5) to curb post-convergence divergence
seed: 42
