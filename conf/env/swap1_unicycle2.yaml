# @package env
# db-CBS benchmark instance `swap1_unicycle2.yaml`, ported verbatim.
#   https://github.com/IMRCLab/db-CBS  example/swap1_unicycle2.yaml
#     environment: min [0,0] max [5,5], obstacles: []
#     robots: 1x unicycle_second_order_0, start [1,2.5,0,0,0] goal [4,2.5,0,0,0]
#
# SINGLE robot -- this is the instance for testing a shaping POTENTIAL. swap2 (two
# robots head-on on the same line, each one's goal being the other's start) is a
# COORDINATION problem: IPPO scores 0% success there with any position-only or
# braking-aware potential, because the agent-blind cost map drives both into a
# symmetric head-on. Testing the potential there measures the wrong thing.
#
# Deviations from the benchmark are the same as swap2_unicycle2.yaml: goal test is
# position-radius + speed gate rather than one weighted state-space distance; the
# `reward:` block and max_steps are ours (the benchmark is a planning problem).
world_size: 5.0
dt: 0.1
max_steps: 300       # 30 s; the 3 m traverse at v_max=0.5 needs >= 6 s plus braking

# db-CBS example/algorithms.yaml: goal_epsilon 0.2 (SST / K-CBS / S2M2), delta_0 0.5.
goal_radius: 0.2

reward:
  reach: 50.0
  collision: -2.0
  step_penalty: -0.01
  shaping_scale: 4.0
  effort_penalty: -0.002
  # coef*ω² per step, coef <= 0. effort_penalty charges angular ACCEL, so a constant-rate spin
  # (α=0) is free without this. 0.04*omega_max² = 0.04*0.5² = 0.01 = |step_penalty|,
  # i.e. a sustained full-rate spin costs about one extra step.
  omega_penalty: -0.04

omega_max_override: null
a_max_override: null
terminate_on_collision: false
require_stop_at_goal: true
# Weighted goal metric (weights [1, 0.5, 0.25, 0.25] vs goal_epsilon 0.2) leaves
# |dv| <~ 0.4, i.e. 0.8*v_max -- far looser than a tight speed gate.
stop_speed: 0.4

obstacles: []

agents:
  - id: agent_0
    start: [1.0, 2.5, 0.0, 0.0, 0.0]
    goal:  [4.0, 2.5, 0.0, 0.0, 0.0]
    robot: unicycle_db
