# @package env
world_size: 5.0
dt: 0.05
max_steps: 1000
goal_radius: 0.2

reward:
  reach: 10.0
  collision: -5.0
  step_penalty: -0.01

obstacles:
  - x: 1.5
    y: 1.5
    shape: {type: circle, radius: 0.3}
  - x: 2.5
    y: 1.0
    angle: 0.0
    shape: {type: box, width: 0.5, length: 0.3}

agents:
  - id: agent_0
    start: [0.2, 0.2, 0.0]
    goal:  [3.0, 3.0, 0.0]
    robot: unicycle_v1
  - id: agent_1
    start: [3.0, 0.2, 0.0]
    goal:  [0.0, 3.0, 0.0]
    robot: unicycle_v1
