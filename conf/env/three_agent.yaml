# @package env
world_size: 6.0
dt: 0.05
max_steps: 600
goal_radius: 0.2

reward:
  reach: 10.0
  collision: -5.0
  step_penalty: -0.01

obstacles:
  - x: 3.0
    y: 3.0
    shape: {type: circle, radius: 0.4}
  - x: 1.5
    y: 4.0
    shape: {type: box, width: 0.4, length: 0.6}
  - x: 4.5
    y: 2.0
    shape: {type: box, width: 0.6, length: 0.4}

agents:
  - id: agent_0
    start: [0.5, 0.5, 0.785]
    goal:  [5.5, 5.5, 0.0]
    robot: unicycle_v1
  - id: agent_1
    start: [5.5, 0.5, 2.356]
    goal:  [0.5, 5.5, 0.0]
    robot: unicycle_v1
  - id: agent_2
    start: [3.0, 0.5, 1.571]
    goal:  [3.0, 5.5, 0.0]
    robot: unicycle_v2
