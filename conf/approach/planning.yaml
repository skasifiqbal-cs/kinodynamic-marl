# @package _global_
# Planning approach: solve with a classical / kinodynamic planner instead of RL.
# No training, no checkpoint — controls are computed online over the same env.
#
#   python main.py approach=planning approach.method=karc
#   python evaluate.py approach=planning approach.method=optimization eval.episodes=50
#
# Everything a planning run depends on lives under `approach:` below, so
# `python main.py approach=planning --cfg job` shows the full experiment.
approach:
  type: planning
  method: karc         # rrt | kinodynamic_rrt | optimization | karc

  # ── Shared nonlinear-program settings ───────────────────────────────────────
  # Read by every optimisation-based method (`optimization`, `karc`), so the
  # solver behaves identically across them and only the coordination differs.
  trajopt:
    solver: ipopt      # CasADi + IPOPT — pip install -e ".[planning]"
    # Time budget. horizon * env.dt is the trajectory duration the program may
    # use, so a hardcoded value silently goes infeasible when dt or the robot
    # changes. null derives it from the bang-bang traverse time; `slack` is the
    # multiplier over that straight-line optimum, leaving room for detours.
    horizon: null
    slack: 1.5
    # Objective is  effort_weight * sum||u||^2 + T.  Larger = smoother, slower.
    effort_weight: 0.01
    goal_tol: 0.2      # metres; keep <= env.goal_radius
    # Separation margin added to every clearance constraint. Not cosmetic:
    # minimising time drives the solution onto the constraint boundary, and a
    # trajectory clearing an obstacle by millimetres at the knots overlaps it
    # once execution drifts off them.
    clearance: 0.05
    max_iters: 500
    # dt is a DECISION VARIABLE when free (true minimum time, K-ARC's objective).
    # Execution needs the env's grid, so planners pass dt_fixed=env.dt; these
    # bounds apply only to free-dt solves used for planning-quality comparisons.
    dt_bounds: [0.02, 0.5]

  # ── K-ARC (arXiv:2501.01559) ────────────────────────────────────────────────
  karc:
    # Number of equal segments the reference path is split into (K-ARC's `m`).
    # Segmentation synchronises milestones so robots share a time grid, which is
    # what makes the inter-robot constraints meaningful. The paper does not publish
    # its value, and results are SENSITIVE to it -- measured on the three 2-robot
    # scenarios in the repo at the time (swap2 / crossing_2agent / gap), m=1 and m=4
    # solved all three while m=2, 3 and 6 each failed at least one. crossing_2agent has
    # since been deleted as a near-duplicate of gap, so re-sweep before quoting this. No m produced a collision, so the cost of a bad m is a robot
    # that stops short, not one that crashes. Sweep it before reporting anything.
    m_segments: 4
    # How a subproblem's robot set R' is chosen when a segment has several conflicts.
    #   pair    - one subproblem per conflicting PAIR, which is what ARC specifies
    #             (arXiv:2312.08554 SS IV-B, "R' = R_i u R_j merges the involved robots").
    #             R' then grows only reactively, when resolving one conflict invalidates a
    #             resolution already made this round.
    #   merged  - every conflicting robot in the segment in ONE subproblem. What this
    #             implementation did before 2026-09-07; kept for the ablation, since it is
    #             the difference between 16 independent pair solves and one 32-robot solve.
    subproblem: pair
    # Conflict predicate: robots closer than d_min at the same index conflict.
    # null -> sum of the two bounding radii + trajopt.clearance. This is a purely
    # GEOMETRIC test with no velocity term, faithful to K-ARC Eq. 6.
    d_min: null
    # Resolution ladder. Each rung is tried in order on a failed subproblem; drop one
    # to ablate its contribution.
    # The default is K-ARC's own hierarchy (SS III-C): prioritized trajectory optimisation,
    # then Decoupled Kinodynamic RRT, then Composite Kinodynamic RRT. The last two exist
    # because the first cannot change homotopy class -- a prioritised re-solve can only make
    # a robot slow down or stop, never route it the other way round an obstacle -- so a
    # ladder of trajopt-only rungs is not K-ARC's ladder, whatever else it can do.
    #   prioritized    - re-solve the conflicting robots one at a time, each avoiding the
    #                    trajectories already fixed this round. Cheapest.
    #   decoupled_rrt  - same ordering, but each robot gets a kinodynamic RRT (time-gridded,
    #                    see src/approach/planning/krrt.py) instead of a nonlinear program.
    #   composite_rrt  - ONE tree over the joint state of R'. Complete for the subproblem in
    #                    the limit, exponential in |R'|; last for that reason.
    # NOT K-ARC, kept for ablation and available by naming them here:
    #   relaxed_goal   - prioritized, but lower-priority robots get a looser terminal
    #                    tolerance (relax_per_level), so they stop short rather than fail.
    #   joint          - the conflicting robots in ONE nonlinear program so both can yield.
    #                    Solves a symmetric head-on swap that no ordering can; the
    #                    optimisation-side counterpart of composite_rrt.
    ladder: [prioritized, decoupled_rrt, composite_rrt]
    # Sampling-rung knobs, shared by both RRT rungs.
    rrt_seed: 0          # tree growth is randomised, so a run is only reproducible per-seed.
    rrt_iters: 3000      # extension attempts before giving up and failing the rung.
    rrt_controls: 10     # controls sampled per extension; the best is kept (best-input RRT).
    rrt_steps: 5         # env.dt steps one control is held for. MUST divide the segment
                         # horizon's grid -- node depth is the timestep index, which is what
                         # keeps an RRT trajectory comparable with a trajopt one.
    rrt_goal_bias: 0.15  # probability of expanding the goal-closest node instead of a random one.
    # AdaptSubProblem (Alg. 2 line 10). When the WHOLE solver hierarchy fails on a window,
    # widen it and run the hierarchy again. K-ARC §III-C: "we adapt the subproblem by
    # setting the start query to the robot's previous segment start and the goal query to
    # its next segment goal ... as opposed to in ARC where the queries are obtained by small
    # incremental expansions". This is how many segments BACK the start query may move; 1 is
    # K-ARC's "previous segment". 0 disables adaptation, which is what this implementation
    # did before 2026-09-07 -- and without it max_rounds re-solves a near-identical problem,
    # since nothing about the window has changed between rounds.
    #
    # DEVIATION: only the backward half. Moving the goal query to the NEXT segment's
    # milestone would have this window overtake segments that are unplanned for every other
    # robot, so there would be nothing to avoid there and the outer loop would have to skip
    # them per-robot. The mechanism's purpose -- room to manoeuvre that the window did not
    # previously contain -- is served by re-opening committed motion.
    adapt_max: 1
    # Planning time budget in seconds for the WHOLE instance, matching K-ARC's experimental
    # setup (SS V), which gives every method 600 s. Checked between rungs, rounds and
    # segments, so the overshoot is one solver call. On expiry every robot brakes to rest and
    # the run reports `timed_out=1` with the remaining segments counted unsolved -- a timeout
    # is a FAILURE, not a slow success, and must be reported as one. null disables it.
    timeout: 600.0
    # Cap on resolution rounds per segment before the segment is committed as-is.
    max_rounds: 3
    # Priority order within a subproblem: index (agent order) or distance
    # (closest-to-goal first).
    priority: index
    # Keep every intermediate stage of the plan (reference paths, the uncoordinated
    # solve, the conflicts it produced, what each rung changed) so scripts/karc_trace_gif.py
    # can draw the planning PROCESS. Off by default: it holds the whole trajectory history
    # in memory, which at N=32 is not free.
    trace: false
    # Terminal tolerance granted to lower-priority robots, in multiples of
    # trajopt.goal_tol, per priority level. 1.0 makes the `relaxed_goal` rung a
    # no-op (identical to `prioritized`), so it must exceed 1 to do anything.
    relax_per_level: 3.0

  # ── Sampling-based methods ──────────────────────────────────────────────────
  rrt:
    max_iters: 5000
    step_size: 0.3
    goal_sample_rate: 0.1

  kinodynamic_rrt:
    max_iters: 10000
    n_control_samples: 10
    propagation_dt: 0.05
    propagation_steps: 5

  # `optimization` (prioritised one-shot trajopt, K-ARC's first ladder rung)
  # takes all of its settings from `trajopt` above and needs no block.
  optimization: {}
