# @package approach
# Planning approach: solve with a classical / kinodynamic planner instead of RL.
# No training, no checkpoint — controls are computed online over the same env.
#
#   python main.py approach=planning approach.method=rrt
#   python main.py approach=planning approach.method=kinodynamic_rrt eval.episodes=50
#
# Each method reads its own same-named param block below (build_planner passes it in).
type: planning
method: rrt            # rrt | kinodynamic_rrt | optimization

rrt:
  max_iters: 5000
  step_size: 0.3
  goal_sample_rate: 0.1

kinodynamic_rrt:
  max_iters: 10000
  n_control_samples: 10
  propagation_dt: 0.05
  propagation_steps: 5

optimization:
  solver: ipopt       # CasADi + IPOPT (pip install -e ".[planning]")
  horizon: null         # null -> derived from the bang-bang traverse time (see _auto_horizon)
  slack: 1.5            # time-budget multiplier over the straight-line optimum
  effort_weight: 0.01   # weight on sum||u||^2 against trajectory duration
  goal_tol: 0.2         # metres; keep <= env.goal_radius
  clearance: 0.05       # separation margin; 0 puts the solution ON the constraint
                        # boundary, where execution drift becomes a real collision
  max_iters: 500
