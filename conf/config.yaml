defaults:
  - env: crossing_2agent  # conf/env/*.yaml — full scenario (world + obstacles + agents)
  - shaping: dijkstra    # conf/shaping/*.yaml — none | euclidean | dubins | dijkstra
  - network: mlp         # conf/network/*.yaml — mlp | gru
  - obs: full_state      # conf/obs/*.yaml — full_state | lidar
  - init: fixed          # conf/init/*.yaml — fixed | random_heading | random
  - train: ppo_default   # conf/train/*.yaml
  - _self_

# Robot yamls live in conf/robot/ and are loaded at runtime by name (no listing needed here).
# To add a robot: create conf/robot/my_robot.yaml and reference it in an env yaml.

wandb:
  enabled: false
  project: kinodynamic-rl
  entity: null

eval:
  checkpoint: null
  episodes: 1
  gif_path: episode.gif
  fps: 15
