defaults:
  # `approach` also pulls in the groups that are specific to it: the RL approach
  # owns network/ and train/, so a planning run has neither.
  - approach: reinforcement_learning  # conf/approach/*.yaml — reinforcement_learning | planning
  - env: gap_2agent       # conf/env/*.yaml — full scenario (world + obstacles + agents)
  - shaping: dijkstra    # conf/shaping/*.yaml — none | euclidean | dubins | dijkstra
  - obs: full_state      # conf/obs/*.yaml — full_state | lidar
  - init: fixed          # conf/init/*.yaml — fixed | random_heading | random
  - _self_
  # YOUR experiment goes in conf/experiment/local.yaml, which is gitignored — see
  # conf/experiment/local.yaml.example. `optional` means Hydra silently skips it when
  # the file is absent, so a fresh clone runs the defaults above unchanged. Listed
  # last so it overrides everything, and untracked so two people changing experiments
  # never collide in this file. Do NOT edit the defaults above to switch experiments.
  - optional experiment: local

# Robot yamls live in conf/robot/ and are loaded at runtime by name (no listing needed here).
# To add a robot: create conf/robot/my_robot.yaml and reference it in an env yaml.

wandb:
  enabled: false
  project: kinodynamic-rl
  # Which W&B account/team the runs land in. Defaults to $WANDB_ENTITY so a collaborator
  # sets it once in their shell; left unset, runs go to whoever is logged in locally,
  # where the rest of us cannot see them. See docs/dhrubo_wandb.md.
  entity: ${oc.env:WANDB_ENTITY,null}

eval:
  checkpoint: null
  episodes: 1
  gif_path: episode.gif
  fps: 15
