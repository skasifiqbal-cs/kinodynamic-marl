network:
  type: mlp
  hidden_sizes:
  - 128
  - 128
  activation: tanh
train:
  timesteps: 4000
  num_envs: 16
  rollouts: 256
  learning_rate: 5.0e-05
  discount: 0.99
  lambda_: 0.95
  clip_ratio: 0.2
  epochs: 3
  mini_batches: 8
  value_preprocessor: false
  entropy_loss_scale: 0.01
  kl_threshold: 0.01
  min_lr: 1.0e-05
  max_lr: 0.0001
  seed: 42
  checkpoint_interval: 999999
approach:
  type: reinforcement_learning
env:
  world_size: 17.0
  dt: 0.1
  max_steps: 650
  goal_radius: 0.2
  reward:
    reach: 50.0
    collision: -2.0
    step_penalty: -0.01
    shaping_scale: 4.0
    effort_penalty: -0.002
    omega_penalty: -0.04
  omega_max_override: null
  terminate_on_collision: false
  require_stop_at_goal: true
  stop_speed: 0.4
  obstacles: []
  agents:
  - id: agent_0
    start:
    - 1.0
    - 1.0
    - 0.0
    - 0.0
    - 0.0
    goal:
    - 16.0
    - 1.0
    - 0.0
    - 0.0
    - 0.0
    robot: unicycle_db
  - id: agent_1
    start:
    - 16.0
    - 1.0
    - 3.14159
    - 0.0
    - 0.0
    goal:
    - 1.0
    - 1.0
    - 3.14159
    - 0.0
    - 0.0
    robot: unicycle_db
  - id: agent_2
    start:
    - 1.0
    - 16.0
    - 0.0
    - 0.0
    - 0.0
    goal:
    - 16.0
    - 16.0
    - 0.0
    - 0.0
    - 0.0
    robot: unicycle_db
  - id: agent_3
    start:
    - 16.0
    - 16.0
    - 3.14159
    - 0.0
    - 0.0
    goal:
    - 1.0
    - 16.0
    - 3.14159
    - 0.0
    - 0.0
    robot: unicycle_db
shaping:
  type: euclidean
  gamma: 1.0
obs:
  type: full_state
init:
  type: fixed
wandb:
  enabled: false
  project: kinodynamic-rl
  entity: ${oc.env:WANDB_ENTITY,null}
eval:
  checkpoint: null
  episodes: 1
  gif_path: episode.gif
  fps: 15
